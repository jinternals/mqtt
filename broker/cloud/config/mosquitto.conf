# ============================================================================
# CLOUD BROKER  (central / "hub")
# Every site bridges INTO this broker. It never dials out to a site, because
# edge sites sit behind NAT/CGNAT on flaky links and have no stable address.
# ============================================================================

per_listener_settings false

# ---------------------------------------------------------------------------
# Durability
#   Bridges connect with cleansession=false, so the cloud broker holds a
#   persistent session per site. Anything published to cmd/<site>/... while a
#   site is offline is queued here and flushed on reconnect.
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# Inflight/queue tuning. QoS1 is our floor for every business topic, so the
# broker must be able to hold a real backlog for a site that has been dark.
max_queued_messages 100000
max_inflight_messages 40
max_queued_bytes 268435456
message_size_limit 262144
queue_qos0_messages false

# ---------------------------------------------------------------------------
# Listeners
#   1883 is bound to the container only (never published to the host) and is
#   there for local ops tooling. All real traffic goes over 8883/TLS.
# ---------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

listener 8883 0.0.0.0
protocol mqtt
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/cloud-broker.crt
keyfile  /mosquitto/certs/cloud-broker.key
tls_version tlsv1.2
# Server-auth TLS + password auth. Flip to true (and issue client certs) if you
# want mTLS; the bridge configs already carry a CA so it is a small step.
require_certificate false

# ---------------------------------------------------------------------------
# AuthN / AuthZ
# ---------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file      /mosquitto/config/acl

# ---------------------------------------------------------------------------
# Connection hygiene
# ---------------------------------------------------------------------------
max_keepalive 120
max_connections -1

# NOTE: persistent_client_expiration is deliberately NOT set.
#
# It would delete a session -- and everything queued for it -- after a fixed
# absence. That is an expiry rule applied to telemetry and health, which in this
# system are never allowed to expire: a site that has been dark for two days
# must still deliver every reading it captured, and the cloud service must still
# find its own backlog waiting after a long outage of its own.
#
# The ONLY expiry in the system is the per-command Message Expiry Interval set
# by the cloud service (15 minutes by default). A stale command is a hazard; a
# stale reading is just history.
#
# The operational cost of this choice is real and worth stating: sessions for
# sites that are decommissioned rather than merely offline will accumulate here
# forever. In production that is handled by explicitly deleting the session when
# a site is retired, not by a timer that cannot tell the two apart. The queue
# caps below are what bound the damage in the meantime.

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# $SYS tree is how we scrape broker health (queue depth, dropped messages).
sys_interval 10
