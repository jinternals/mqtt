# ============================================================================
# Cloud (fleet) service
# ============================================================================
spring:
  application:
    name: cloud-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

app:
  cloud:
    health-timeout: ${HEALTH_TIMEOUT:60s}
    backlog-lag-threshold: ${BACKLOG_LAG_THRESHOLD:30s}
    # The ONLY expiry in the system. A command that has waited longer than this
    # for an offline site is dropped rather than executed late.
    default-command-ttl: ${DEFAULT_COMMAND_TTL:15m}
    command-retention: 1h

mqtt:
  url: ${MQTT_URL}
  client-id: cloud-service
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  # Durable session here too: if this service restarts, telemetry and command
  # responses that arrived meanwhile are still waiting for it on the broker.
  clean-start: false
  # Never. Anything queued for us while we are away is telemetry or health,
  # and neither expires. Commands are the only thing in this system with a
  # deadline, and it lives on the message, not on the session.
  session-expiry: 4294967295s
  qos: 1
  keep-alive: 20s
  connection-timeout: 10s
  max-reconnect-delay: 30s
  # CLIENT-side store of messages published but not yet acknowledged. Note this is
  # NOT the store-and-forward buffer -- that is the BROKER's persistence_location.
  # Publishing to a broker on the same LAN is acknowledged in ~1ms, so this stays
  # empty in practice; it exists to cover a crash inside that window. Mounted on a
  # volume so that window is actually covered rather than merely appearing to be.
  persistence-directory: /var/lib/mqtt-client
  ssl:
    trust-store: ${MQTT_TRUSTSTORE:}
    trust-store-password: ${MQTT_TRUSTSTORE_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.jinternals.mqtt: INFO
    org.eclipse.paho: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{28} - %msg%n"
